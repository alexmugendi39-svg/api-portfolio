<!DOCTYPE html>
<html>
<head>
<title>Kenyan Business Currency Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#111;color:white;text-align:center;padding:20px}
.box{background:#222;padding:20px;border-radius:15px;max-width:400px;margin:auto}
input,select{width:90%;padding:12px;margin:10px;border-radius:10px;border:none;font-size:16px}
button{background:#00c853;color:white;padding:12px 25px;border:none;border-radius:10px;font-size:18px;cursor:pointer;width:95%}
#result{font-size:24px;margin-top:15px;color:#00e676;font-weight:bold}
small{color:#aaa}
</style>
</head>
<body>
<h1>🇰🇪 Kenyan Currency Tracker</h1>
<p>Live Rates • For Business</p>
<div class="box">
<input type="number" id="amount" placeholder="Weka Amount KES" value="1000">
<select id="to">
<option value="USD">USD - Dollar</option>
<option value="EUR">EUR - Euro</option>
<option value="GBP">GBP - Pound</option>
<option value="UGX">UGX - Uganda</option>
<option value="TZS">TZS - Tanzania</option>
</select>
<button onclick="convert()">Convert Now</button>
<div id="result">--</div>
<small id="updated"></small>
</div>
<p><a href="https://github.com/alexmugendi39-svg/api-portfolio" style="color:#00e676">View My GitHub Portfolio</a></p>

<script>
async function convert(){
  let amt = document.getElementById("amount").value;
  let to = document.getElementById("to").value;
  document.getElementById("result").innerText = "Loading...";
  try{
    let res = await fetch("https://open.er-api.com/v6/latest/KES");
    let data = await res.json();
    let rate = data.rates[to];
    let total = (amt * rate).toFixed(2);
    document.getElementById("result").innerText = amt + " KES = " + total + " " + to;
    document.getElementById("updated").innerText = "1 KES = " + rate + " " + to + " | Updated: " + data.time_last_update_utc;
  }catch(e){
    document.getElementById("result").innerText = "No internet - try again";
  }
}
convert();
</script>
</body>
</html>
